name: qota
description: "Qota — plateforme universelle d'évaluation (services, lieux, figures publiques, User Items)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # Routing
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # UI / UX
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Utils
  # intl n'est volontairement PAS déclaré ici : flutter_localizations
  # l'apporte déjà en dépendance transitive et pin automatiquement la
  # bonne version selon le SDK Flutter utilisé (local ou CI) — le
  # déclarer nous-mêmes ne fait que créer des conflits de version.
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Génère les icônes natives (Android/iOS/Web) à partir du logo officiel.
# Commande : flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#141414" # noir de fond du logo (Android 8+)
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#141414"
    theme_color: "#F15A24"

# Génère l'écran de démarrage natif, assorti au logo (fond noir,
# logo centré) au lieu de l'écran blanc par défaut de Flutter.
# Commande : flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#141414"
  image: assets/icon/app_icon.png
  android_12:
    color: "#141414"
    image: assets/icon/app_icon.png
  web: false # le web garde son propre chargement, pas de splash natif ici

flutter:
  uses-material-design: true
  generate: true # active la génération l10n depuis lib/l10n/*.arb

  assets:
    - assets/icon/
