name: Qota CI/CD

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. ANALYSE STATIQUE + TESTS
  # ============================================================

  analyze_and_test:
    name: Analyse & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances
        run: flutter pub get

      - name: Générer les fichiers l10n
        run: flutter gen-l10n

      - name: Analyse statique
        run: flutter analyze --fatal-infos

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed .

      - name: Tests unitaires et widgets
        run: flutter test --coverage

      - name: Publier la couverture de tests
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info


  # ============================================================
  # 2. BUILD WEB
  # ============================================================

  build_web:
    name: Build Web
    needs: analyze_and_test
    runs-on: ubuntu-latest

    # Seulement sur push, pas sur Pull Request
    if: github.event_name == 'push'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances
        run: flutter pub get

      - name: Générer les fichiers l10n
        run: flutter gen-l10n

      - name: Construire Flutter Web
        run: |
          flutter build web --release \
            --base-href "/QOTA-Flutter-app/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      # Artefact classique de GitHub Actions
      - name: Publier l'artefact Web
        uses: actions/upload-artifact@v4
        with:
          name: qota-web-build
          path: build/web

      # Artefact destiné à GitHub Pages
      - name: Préparer GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web


  # ============================================================
  # 3. DÉPLOIEMENT GITHUB PAGES
  # ============================================================

  deploy_pages:
    name: Deploy GitHub Pages
    needs: build_web
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # 4. BUILD ANDROID
  # ============================================================

  build_android:
    name: Build Android
    needs: analyze_and_test
    runs-on: ubuntu-latest

    # Android seulement sur main
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Installer les dépendances
        run: flutter pub get

      - name: Générer les fichiers l10n
        run: flutter gen-l10n

      - name: Construire APK Release
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: qota-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
