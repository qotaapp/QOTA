# ============================================================
# QOTA — DÉPLOIEMENT RENDER (Web)
# Deux services statiques : un pour `develop` (staging), un pour
# `main` (production) — cohérent avec l'exigence "CI/CD, tests,
# staging et production" du cahier des charges.
#
# IMPORTANT : l'environnement de build Render (env: static) est un
# Ubuntu nu SANS Flutter préinstallé. Le buildCommand clone donc le
# SDK Flutter (branche stable, clone superficiel) avant de builder —
# c'est la même approche que fait `subosito/flutter-action` en
# coulisses pour GitHub Actions.
# ============================================================

services:
  - type: web
    name: qota-web-staging
    env: static
    branch: develop
    buildCommand: |
      git clone https://github.com/flutter/flutter.git --depth 1 -b stable _flutter_sdk
      export PATH="$PATH:$(pwd)/_flutter_sdk/bin"
      flutter --version
      flutter pub get
      flutter gen-l10n
      flutter build web --release \
        --dart-define=SUPABASE_URL=$SUPABASE_URL \
        --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    staticPublishPath: build/web
    envVars:
      - key: SUPABASE_URL
        sync: false # défini dans le Dashboard Render (secret)
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # SPA Flutter Web — toutes les routes vers index.html

  - type: web
    name: qota-web-production
    env: static
    branch: main
    buildCommand: |
      git clone https://github.com/flutter/flutter.git --depth 1 -b stable _flutter_sdk
      export PATH="$PATH:$(pwd)/_flutter_sdk/bin"
      flutter --version
      flutter pub get
      flutter gen-l10n
      flutter build web --release \
        --dart-define=SUPABASE_URL=$SUPABASE_URL \
        --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    staticPublishPath: build/web
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
