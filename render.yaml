# ============================================================
# QOTA — DÉPLOIEMENT RENDER (Web)
# Deux services statiques : un pour `develop` (staging), un pour
# `main` (production) — cohérent avec l'exigence "CI/CD, tests,
# staging et production" du cahier des charges.
# ============================================================

services:
  - type: web
    name: qota-web-staging
    runtime: static
    branch: develop
    buildCommand: |
      flutter pub get &&
      flutter gen-l10n &&
      flutter build web --release \
        --dart-define=SUPABASE_URL=$SUPABASE_URL \
        --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    staticPublishPath: build/web
    envVars:
      - key: SUPABASE_URL
        sync: false # défini dans le Dashboard Render (secret)
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # SPA Flutter Web — toutes les routes vers index.html

  - type: web
    name: qota-web-production
    runtime: static
    branch: main
    buildCommand: |
      flutter pub get &&
      flutter gen-l10n &&
      flutter build web --release \
        --dart-define=SUPABASE_URL=$SUPABASE_URL \
        --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    staticPublishPath: build/web
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
